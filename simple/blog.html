<!DOCTYPE html>
<html dir="rtl" lang="fa" data-theme="classic">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مقالات | چاه‌یار — راهنماها و نکات تخلیه چاه</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="site-header-slot"></div>

  <section class="page-hero">
    <div class="container">
      <div class="crumb"><a href="index.html">خانه</a><i data-lucide="chevron-left"></i><span>مقالات</span></div>
      <h1>مقالات و راهنماها</h1>
      <p>نکات کاربردی درباره‌ی تخلیه چاه، لوله‌بازکنی، نگهداری فاضلاب و هزینه‌ها.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <!-- فیلتر دسته‌بندی -->
      <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:34px" id="cats"></div>
      <div class="grid grid-3" id="blog-grid"></div>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="container">
      <div class="cta-band">
        <h2>سؤالی دارید که جوابش را پیدا نکردید؟</h2>
        <p>کارشناسان ما رایگان راهنمایی‌تان می‌کنند.</p>
        <a href="tel:+982191008877" class="btn btn-ghost btn-lg"><i data-lucide="phone-call"></i> ۰۲۱-۹۱۰۰۸۸۷۷</a>
      </div>
    </div>
  </section>

  <div id="site-footer-slot"></div>

  <script src="assets/data.js"></script>
  <script src="assets/site.js"></script>
  <script>
    (function () {
      const arts = window.CHAHYAR_ARTICLES || [];
      const cats = ["همه", ...new Set(arts.map(a => a.cat))];
      const catWrap = document.getElementById("cats");
      let active = "همه";

      function render() {
        const list = active === "همه" ? arts : arts.filter(a => a.cat === active);
        document.getElementById("blog-grid").innerHTML = list.map(a => `
          <a href="article.html" class="card article-card">
            <div class="ph thumb">[ تصویر مقاله ]</div>
            <div class="body"><span class="cat">${a.cat}</span><h3>${a.title}</h3>
            <p class="excerpt">${a.excerpt}</p>
            <div class="meta"><span><i data-lucide="calendar"></i>${a.date}</span><span><i data-lucide="clock"></i>${a.read}</span></div></div>
          </a>`).join("");
        if (window.lucide) lucide.createIcons();
      }
      catWrap.innerHTML = cats.map(c => `<button class="btn ${c===active?'btn-primary':'btn-ghost'}" data-c="${c}" style="font-size:14px;padding:9px 18px">${c}</button>`).join("");
      catWrap.addEventListener("click", e => {
        const b = e.target.closest("button[data-c]"); if (!b) return;
        active = b.dataset.c;
        catWrap.querySelectorAll("button").forEach(x => { x.className = "btn " + (x.dataset.c===active?"btn-primary":"btn-ghost"); x.style.fontSize="14px"; x.style.padding="9px 18px"; });
        render();
      });
      render();
    })();
  </script>
</body>
</html>
